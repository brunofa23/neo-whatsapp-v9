name: Build and deploy api

on:
  push:
    branches:
      - main-officialApi
####
jobs:
  build-and-deploy:
    name: Build api typescript project and deploy it to server
    runs-on: ubuntu-latest

    steps:
      # Trabalha em cima da production-officialApi
      - name: Checkout production-officialApi
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: production-officialApi

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Set up Git user
        run: |
          git config --global user.email "brunofa23@gmail.com"
          git config --global user.name "Bruno Favato"

      # Traz a main-officialApi atualizada do remoto
      - name: Fetch main-officialApi
        run: |
          git fetch origin main-officialApi

      # Merge da main-officialApi dentro da production-officialApi
      - name: Merge main-officialApi into production-officialApi
        run: |
          git merge --no-ff origin/main-officialApi -m "Merge main-officialApi into production-officialApi"

      - name: Install dependencies
        run: npm install

      # ✅ Seu script build já ignora erros TS:
      # "build": "node ace build --production --ignore-ts-errors"
      - name: Build project (ignore TS errors)
        run: npm run build

      # ✅ Roda seu postbuild (copyMedias.js)
      - name: Postbuild
        run: npm run postbuild

      # (Opcional) garantir deps de prod ok (no runner)
      - name: Check production install
        run: npm ci --production

      - name: Commit build artifacts
        run: |
          git status
          git add -A
          if git diff --cached --quiet; then
            echo "Sem mudanças para commitar."
          else
            git commit -m "chore: build para deploy a partir da main-officialApi"
          fi

      - name: Push to production-officialApi
        run: |
          git push origin HEAD:production-officialApi
