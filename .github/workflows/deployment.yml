name: Build and deploy api

on:
  push:
    branches:
      - main-ai-cob

jobs:
  build-and-deploy:
    name: Build api typescript project and deploy it to server
    runs-on: ubuntu-latest

    steps:
      # Em vez de fazer checkout da main-ai-cob,
      # a gente já trabalha em cima da production-ai-cob
      - name: Checkout production-ai-cob
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: production-ai-cob

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Set up Git user
        run: |
          git config --global user.email "brunofa23@gmail.com"
          git config --global user.name "Bruno Favato"

      # Traz a main-ai-cob atualizada do remoto
      - name: Fetch main-ai-cob
        run: |
          git fetch origin main-ai-cob

      # Faz merge da main-ai-cob dentro da production-ai-cob
      # Agora o commit novo passa a ser continuação da production-ai-cob
      - name: Merge main-ai-cob into production-ai-cob
        run: |
          git merge --no-ff origin/main-ai-cob -m "Merge main-ai-cob into production-ai-cob"

      - name: Install dependencies
        run: npm install

      # Aqui chama: node ace build --production --ignore-ts-errors
      # e DEPOIS o postbuild (copyMedias.js)
      - name: Build project
        run: npm run build

      # (Opcional) só para garantir deps de prod ok no repo (não na VPS)
      - name: Check production install
        run: npm ci --production

      - name: Commit build artifacts
        run: |
          git status
          git add -A
          if git diff --cached --quiet; then
            echo "Sem mudanças para commitar."
          else
            git commit -m "chore: build para deploy a partir da main-ai-cob"
          fi

      - name: Push to production-ai-cob
        run: |
          git push origin HEAD:production-ai-cob
