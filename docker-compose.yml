services:
  mysql56:
    image: mysql:5.6
    container_name: mysql56
    restart: unless-stopped
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "Cartorio@12345"
      MYSQL_DATABASE: "teste"
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql56_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d

volumes:
  mysql56_data:
